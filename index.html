<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <title>Aplicação de Clima</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <main>
      
      <div class="big-box">
        <div class="initial">
          <h1>Clima</h1>
          <input class="city-input" placeholder="Digite o nome da cidade: ">
          <button class="search-button">
            <img class="search-img" width="24" height="24" src="https://img.icons8.com/?size=100&id=elSdeHsB03U3&format=png&color=EBEBEB" alt="lupa"/>
          </button>
        </div>

        <div class="medium-box">
          <h2 class="city">Tempo em São Paulo</h2>
          <p class="temp">21°C</p>
          
          <div class="little-box">
            <img class="img-temp" width="24" height="24" src="https://img.icons8.com/office/40/cloud.png" alt="cloud"/>
        
            <p class="text-temp">Nublado</p>

          </div>
  
          <p class="humidity">umidade: 76%</p>
        </div>
      </div>
  </main>
  
</body>
</html>
